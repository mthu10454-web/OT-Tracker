<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT & Attendance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K7NPT2RY02"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K7NPT2RY02');
    </script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-card { background: white; width: 100%; max-width: 480px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 4px 0; color: #1e293b; font-size: 22px; }
        .header p { margin: 0; color: #64748b; font-size: 13px; font-weight: 500; }

        .btn-install {
            display: none;
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
            cursor: pointer;
        }
        .btn-install:active { transform: scale(0.98); }

        .btn-main { width: 100%; padding: 16px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25); margin-bottom: 20px; cursor: pointer; }
        .btn-main:active { transform: scale(0.98); }
        
        .section-title { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .btn-add-past {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-add-past:active { background: #2563eb; color: white; }
        
        .grid-ot { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 25px; }
        .btn-ot { padding: 14px 10px; background: #f8fafc; color: #2563eb; border: 1.5px solid #dbeafe; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-ot:active { background: #2563eb; color: white; border-color: #2563eb; }
        .btn-ot.span-2 { grid-column: span 2; }
        
        .summary-box { background: #f8fafc; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; border-bottom: 1px dashed #cbd5e1; }
        .summary-row:last-child { border-bottom: none; }
        .summary-label { color: #475569; }
        .summary-val { font-weight: 700; color: #0f172a; }
        
        .history-box { max-height: 220px; overflow-y: auto; background: #fafafa; border-radius: 10px; padding: 10px; border: 1px solid #f1f5f9; font-size: 13px; color: #64748b; }
        .history-item {
            padding: 8px 4px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-text { flex: 1; line-height: 1.4; }
        .btn-edit {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-edit:active {
            background: #2563eb;
            color: white;
        }
        
        .btn-reset { width: 100%; margin-top: 20px; padding: 12px; background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

        /* Modal Styles (Edit & Past Date) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .modal-title { font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 4px 0; }
        .modal-subtitle { font-size: 13px; color: #64748b; margin: 0 0 16px 0; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            color: #0f172a;
        }
        .form-group input:focus { outline: none; border-color: #2563eb; }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .modal-btn {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; color: white; }
        .btn-cancel { background: #f1f5f9; color: #475569; }
        .btn-delete-row { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>OAKKER KYAW</h2>
            <p id="currentDateDisplay">ယနေ့ရက်စွဲ: -</p>
        </div>

        <button id="installAppBtn" class="btn-install">📲 App အဖြစ် Install လုပ်မည်</button>
        
        <button class="btn-main" onclick="logAttendance(1, 0)">✓ ပုံမှန်အလုပ်ဆင်းရက် (၁ ရက်)</button>
        
        <div class="section-title">
            <span>+ OT အချိန် ရွေးချယ်ရန်</span>
        </div>
        
        <div class="grid-ot">
            <button class="btn-ot" onclick="logAttendance(0, 1)">+ 1 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 1.5)">+ 1 နာရီခွဲ</button>
            <button class="btn-ot" onclick="logAttendance(0, 2)">+ 2 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 2.5)">+ 2 နာရီခွဲ</button>
            <button class="btn-ot" onclick="logAttendance(0, 3)">+ 3 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 3.5)">+ 3 နာရီခွဲ</button>
            <button class="btn-ot" onclick="logAttendance(0, 4)">+ 4 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 4.5)">+ 4 နာရီခွဲ</button>
            <button class="btn-ot span-2" onclick="logAttendance(0, 5)">+ 5 နာရီ</button>
        </div>

        <div class="summary-box">
            <div class="section-title" id="monthTitle" style="margin-top: 0;">ဒီလ စုစုပေါင်း စာရင်း</div>
            <div class="summary-row">
                <span class="summary-label">အလုပ်ဆင်းရက်</span>
                <span class="summary-val" id="totalDays">0 ရက်</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">OT စုစုပေါင်း</span>
                <span class="summary-val" id="totalOt">0 နာရီ</span>
            </div>
        </div>

        <div class="section-title">
            <span>ရက်အလိုက် မှတ်တမ်းများ</span>
            <button type="button" class="btn-add-past" onclick="openPastModal()">+ ရက်ဟောင်းထည့်မည်</button>
        </div>
        <div class="history-box" id="logHistory">
            မှတ်တမ်း မရှိသေးပါ။
        </div>
        
        <button class="btn-reset" onclick="resetData()">စာရင်းအားလုံး ဖျက်မည် (Reset)</button>
    </div>

    <!-- Past Date Modal -->
    <div class="modal-overlay" id="pastModal">
        <div class="modal-card">
            <h3 class="modal-title">ရက်ဟောင်း မှတ်တမ်းထည့်ရန်</h3>
            <p class="modal-subtitle">ပြီးခဲ့သည့် ရက်စွဲအလိုက် အလုပ်ဆင်းရက်နှင့် OT ထည့်သွင်းပါ</p>

            <div class="form-group">
                <label for="pastDateInput">ရက်စွဲ ရွေးချယ်ရန်</label>
                <input type="date" id="pastDateInput">
            </div>

            <div class="form-group">
                <label for="pastDayInput">အလုပ်ဆင်းရက် (ဥပမာ - 1, 0.5, 0)</label>
                <input type="number" id="pastDayInput" step="0.5" min="0" value="1">
            </div>

            <div class="form-group">
                <label for="pastOtInput">OT နာရီ (ဥပမာ - 3, 1.5, 0)</label>
                <input type="number" id="pastOtInput" step="0.5" min="0" value="0">
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-btn btn-cancel" onclick="closePastModal()">မလုပ်တော့</button>
                <button type="button" class="modal-btn btn-save" onclick="savePastLog()">ထည့်သွင်းမည်</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 class="modal-title">မှတ်တမ်း ပြင်ဆင်ရန်</h3>
            <p class="modal-subtitle" id="editDateLabel">ရက်စွဲ: -</p>
            
            <div class="form-group">
                <label for="editDayInput">အလုပ်ဆင်းရက် (ဥပမာ - 1, 0.5, 0)</label>
                <input type="number" id="editDayInput" step="0.5" min="0">
            </div>
            
            <div class="form-group">
                <label for="editOtInput">OT နာရီ (ဥပမာ - 3, 1.5, 0)</label>
                <input type="number" id="editOtInput" step="0.5" min="0">
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-btn btn-delete-row" onclick="deleteLogItem()">ဖျက်မည်</button>
                <button type="button" class="modal-btn btn-cancel" onclick="closeEditModal()">မလုပ်တော့</button>
                <button type="button" class="modal-btn btn-save" onclick="saveEditLog()">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const todayStr = year + '-' + String(month).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        
        document.getElementById('currentDateDisplay').innerText = `ယနေ့ရက်စွဲ: ${todayStr}`;
        document.getElementById('monthTitle').innerText = `${year} ခုနှစ်၊ ${month} လပိုင်း စာရင်း`;

        let storageKey = 'historyLogs_' + year + '_' + month;
        let historyLogs = JSON.parse(localStorage.getItem(storageKey)) || [];
        let editingIndex = null;

        function sortLogsByDateDesc() {
            historyLogs.sort(function(a, b) {
                return b.date.localeCompare(a.date);
            });
        }

        function calculateTotals() {
            let d = 0;
            let o = 0;
            historyLogs.forEach(function(log) {
                d += Number(log.day) || 0;
                o += Number(log.ot) || 0;
            });
            return { d: d, o: o };
        }

        function updateDisplay() {
            let totals = calculateTotals();
            document.getElementById('totalDays').innerText = totals.d + ' ရက်';
            document.getElementById('totalOt').innerText = totals.o + ' နာရီ';

            const historyDiv = document.getElementById('logHistory');
            if (historyLogs.length === 0) {
                historyDiv.innerHTML = '<div style="text-align:center; padding: 10px;">မှတ်တမ်း မရှိသေးပါ။</div>';
            } else {
                let htmlContent = '';
                for (let i = 0; i < historyLogs.length; i++) {
                    let log = historyLogs[i];
                    htmlContent += `
                        <div class="history-item">
                            <span class="history-text">📅 <b>${log.date}</b> — အလုပ်: ${log.day} ရက် | OT: ${log.ot} နာရီ</span>
                            <button type="button" class="btn-edit" onclick="openEditModal(${i})" title="ပြင်ဆင်ရန်">✏️</button>
                        </div>
                    `;
                }
                historyDiv.innerHTML = htmlContent;
            }
        }
        updateDisplay();

        function upsertAttendance(targetDate, addDay, addOt, isOverwrite) {
            let existingLog = null;
            for (let i = 0; i < historyLogs.length; i++) {
                if (historyLogs[i].date === targetDate) {
                    existingLog = historyLogs[i];
                    break;
                }
            }

            if (existingLog) {
                if (isOverwrite) {
                    existingLog.day = Number(addDay) || 0;
                    existingLog.ot = Number(addOt) || 0;
                } else {
                    if (addDay > 0) {
                        existingLog.day = (Number(existingLog.day) || 0) + addDay;
                    }
                    if (addOt > 0) {
                        existingLog.ot = (Number(existingLog.ot) || 0) + addOt;
                    }
                }
            } else {
                historyLogs.push({
                    date: targetDate,
                    day: Number(addDay) || 0,
                    ot: Number(addOt) || 0
                });
            }

            sortLogsByDateDesc();
            localStorage.setItem(storageKey, JSON.stringify(historyLogs));
            updateDisplay();
        }

        function logAttendance(addDay, addOt) {
            upsertAttendance(todayStr, addDay, addOt, false);
        }

        /* Past Date Modal Functions */
        function openPastModal() {
            const monthStart = year + '-' + String(month).padStart(2, '0') + '-01';
            const dateInput = document.getElementById('pastDateInput');
            dateInput.min = monthStart;
            dateInput.max = todayStr;
            dateInput.value = todayStr;
            document.getElementById('pastDayInput').value = 1;
            document.getElementById('pastOtInput').value = 0;
            document.getElementById('pastModal').classList.add('active');
        }

        function closePastModal() {
            document.getElementById('pastModal').classList.remove('active');
        }

        function savePastLog() {
            const selectedDate = document.getElementById('pastDateInput').value;
            if (!selectedDate) {
                alert('ကျေးဇူးပြု၍ ရက်စွဲ ရွေးချယ်ပါ။');
                return;
            }
            const dayVal = parseFloat(document.getElementById('pastDayInput').value);
            const otVal = parseFloat(document.getElementById('pastOtInput').value);

            const cleanDay = isNaN(dayVal) ? 0 : dayVal;
            const cleanOt = isNaN(otVal) ? 0 : otVal;

            const hasExisting = historyLogs.some(item => item.date === selectedDate);
            if (hasExisting) {
                const replaceConfirm = confirm(`${selectedDate} အတွက် မှတ်တမ်းရှိပြီးသားဖြစ်ပါသည်။ အသစ်ဖြင့် အစားထိုးသိမ်းမလား?\n(OK = အစားထိုးမည် / Cancel = ပေါင်းထည့်မည်)`);
                upsertAttendance(selectedDate, cleanDay, cleanOt, replaceConfirm);
            } else {
                upsertAttendance(selectedDate, cleanDay, cleanOt, true);
            }

            closePastModal();
        }

        /* Edit Modal Functions */
        function openEditModal(index) {
            editingIndex = index;
            const log = historyLogs[index];
            document.getElementById('editDateLabel').innerText = `ရက်စွဲ: ${log.date}`;
            document.getElementById('editDayInput').value = log.day;
            document.getElementById('editOtInput').value = log.ot;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            editingIndex = null;
            document.getElementById('editModal').classList.remove('active');
        }

        function saveEditLog() {
            if (editingIndex === null) return;
            const newDay = parseFloat(document.getElementById('editDayInput').value);
            const newOt = parseFloat(document.getElementById('editOtInput').value);

            historyLogs[editingIndex].day = isNaN(newDay) ? 0 : newDay;
            historyLogs[editingIndex].ot = isNaN(newOt) ? 0 : newOt;

            sortLogsByDateDesc();
            localStorage.setItem(storageKey, JSON.stringify(historyLogs));
            updateDisplay();
            closeEditModal();
        }

        function deleteLogItem() {
            if (editingIndex === null) return;
            if (confirm("ဒီရက်ရဲ့ မှတ်တမ်းကို ဖျက်မှာ သေချာပါသလား?")) {
                historyLogs.splice(editingIndex, 1);
                localStorage.setItem(storageKey, JSON.stringify(historyLogs));
                updateDisplay();
                closeEditModal();
            }
        }

        function resetData() {
            if (confirm("ယခုလ စာရင်းအားလုံးကို ဖျက်မှာ သေချာပါသလား?")) {
                localStorage.removeItem(storageKey);
                historyLogs = [];
                updateDisplay();
            }
        }

        // Close modal when clicking outside card
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });
        document.getElementById('pastModal').addEventListener('click', function(e) {
            if (e.target === this) closePastModal();
        });

        // In-app Install Prompt
        let deferredPrompt = null;
        const installAppBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installAppBtn.style.display = 'block';
        });

        installAppBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installAppBtn.style.display = 'none';
        });

        window.addEventListener('appinstalled', () => {
            installAppBtn.style.display = 'none';
            deferredPrompt = null;
        });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>

</body>
</html>
