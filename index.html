<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT & Attendance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K7NPT2RY02"></script>
    <script>
      window.dataLayer = window.dataLayer |

| [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K7NPT2RY02');
    </script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-card { background: white; width: 100%; max-width: 480px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 4px 0; color: #1e293b; font-size: 22px; }
        .header p { margin: 0; color: #64748b; font-size: 13px; font-weight: 500; }

        .btn-install {
            display: none;
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
            cursor: pointer;
        }
        .btn-install:active { transform: scale(0.98); }

        .btn-main { width: 100%; padding: 16px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25); margin-bottom: 20px; cursor: pointer; }
        .btn-main:active { transform: scale(0.98); }
        
        .section-title { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .btn-add-past {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-add-past:active { background: #2563eb; color: white; }
        
        .grid-ot { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 25px; }
        .btn-ot { padding: 14px 10px; background: #f8fafc; color: #2563eb; border: 1.5px solid #dbeafe; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-ot:active { background: #2563eb; color: white; border-color: #2563eb; }
        .btn-ot.span-2 { grid-column: span 2; }
        
        .summary-box { background: #f8fafc; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; border-bottom: 1px dashed #cbd5e1; }
        .summary-row:last-child { border-bottom: none; }
        .summary-label { color: #475569; }
        .summary-val { font-weight: 700; color: #0f172a; }
        
        .history-box { max-height: 220px; overflow-y: auto; background: #fafafa; border-radius: 10px; padding: 10px; border: 1px solid #f1f5f9; font-size: 13px; color: #64748b; }
        .history-item {
            padding: 8px 4px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-text { flex: 1; line-height: 1.4; }
        .btn-edit {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-edit:active {
            background: #2563eb;
            color: white;
        }

        .backup-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        .btn-backup {
            padding: 10px;
            background: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-backup:active { background: #e2e8f0; }
        
        .btn-reset { width: 100%; margin-top: 10px; padding: 12px; background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

        /* Edit / Add Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .modal-title { font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 14px 0; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            color: #0f172a;
            background: white;
        }
        .form-group input:disabled {
            background: #f1f5f9;
            color: #64748b;
        }
        .form-group input:focus { outline: none; border-color: #2563eb; }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .modal-btn {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; color: white; }
        .btn-cancel { background: #f1f5f9; color: #475569; }
        .btn-delete-row { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>OAKKER KYAW</h2>
            <p id="currentDateDisplay">ယနေ့ရက်စွဲ: -</p>
        </div>

        <button id="installAppBtn" class="btn-install">📲 App အဖြစ် Install လုပ်မည်</button>
        
        <button class="btn-main" onclick="logAttendance(1, 0)">✓ ပုံမှန်အလုပ်ဆင်းရက် (၁ ရက်)</button>
        
        <div class="section-title">
            <span>+ OT အချိန် ရွေးချယ်ရန်</span>
        </div>
        
        <div class="grid-ot">
            <button class="btn-ot" onclick="logAttendance(0, 1)">+ 1 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 1.5)">+ 1 နာရီခွဲ</button>
            <button class="btn-ot" onclick="logAttendance(0, 2)">+ 2 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 2.5)">+ 2 နာရီခွဲ</button>
            <button class="btn-ot" onclick="logAttendance(0, 3)">+ 3 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 3.5)">+ 3 နာရီခွဲ</button>
            <button class="btn-ot" onclick="logAttendance(0, 4)">+ 4 နာရီ</button>
            <button class="btn-ot" onclick="logAttendance(0, 4.5)">+ 4 နာရီခွဲ</button>
            <button class="btn-ot span-2" onclick="logAttendance(0, 5)">+ 5 နာရီ</button>
        </div>

        <div class="summary-box">
            <div class="section-title" id="monthTitle" style="margin-top: 0;">ဒီလ စုစုပေါင်း စာရင်း</div>
            <div class="summary-row">
                <span class="summary-label">အလုပ်ဆင်းရက်</span>
                <span class="summary-val" id="totalDays">0 ရက်</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">OT စုစုပေါင်း</span>
                <span class="summary-val" id="totalOt">0 နာရီ</span>
            </div>
        </div>

        <div class="section-title">
            <span>ရက်အလိုက် မှတ်တမ်းများ</span>
            <button class="btn-add-past" onclick="openAddModal()">+ ရက်ဟောင်းထည့်</button>
        </div>
        <div class="history-box" id="logHistory">
            မှတ်တမ်း မရှိသေးပါ။
        </div>

        <div class="backup-row">
            <button class="btn-backup" onclick="exportBackup()">⬇️ Backup သိမ်းမည်</button>
            <button class="btn-backup" onclick="triggerImport()">⬆️ Backup ပြန်ထည့်မည်</button>
        </div>
        <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;" onchange="handleImportFile(event)">
        
        <button class="btn-reset" onclick="resetData()">စာရင်းအားလုံး ဖျက်မည် (Reset)</button>
    </div>

    <!-- Edit / Add Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 class="modal-title" id="modalTitleText">မှတ်တမ်း ပြင်ဆင်ရန်</h3>
            
            <div class="form-group">
                <label for="editDateInput">ရက်စွဲ</label>
                <input type="date" id="editDateInput">
            </div>

            <div class="form-group">
                <label for="editDayInput">အလုပ်ဆင်းရက် (ဥပမာ - 1, 0.5, 0)</label>
                <input type="number" id="editDayInput" step="0.5" min="0">
            </div>
            
            <div class="form-group">
                <label for="editOtInput">OT နာရီ (ဥပမာ - 3, 1.5, 0)</label>
                <input type="number" id="editOtInput" step="0.5" min="0">
            </div>

            <div class="modal-actions">
                <button class="modal-btn btn-delete-row" id="btnDeleteRow" onclick="deleteLogItem()">ဖျက်မည်</button>
                <button class="modal-btn btn-cancel" onclick="closeEditModal()">မလုပ်တော့</button>
                <button class="modal-btn btn-save" onclick="saveEditLog()">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const todayStr = year + '-' + String(month).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        
        document.getElementById('currentDateDisplay').innerText = `ယနေ့ရက်စွဲ: ${todayStr}`;
        document.getElementById('monthTitle').innerText = `${year} ခုနှစ်၊ ${month} လပိုင်း စာရင်း`;

        let storageKey = 'historyLogs_' + year + '_' + month;
        let historyLogs = JSON.parse(localStorage.getItem(storageKey)) |

| [];
        let editingIndex = null;

        function calculateTotals() {
            let d = 0;
            let o = 0;
            historyLogs.forEach(function(log) {
                d += Number(log.day) |

| 0;
                o += Number(log.ot) |

| 0;
            });
            return { d: d, o: o };
        }

        function updateDisplay() {
            let totals = calculateTotals();
            document.getElementById('totalDays').innerText = totals.d + ' ရက်';
            document.getElementById('totalOt').innerText = totals.o + ' နာရီ';

            const historyDiv = document.getElementById('logHistory');
            if (historyLogs.length === 0) {
                historyDiv.innerHTML = '<div style="text-align:center; padding: 10px;">မှတ်တမ်း မရှိသေးပါ။</div>';
            } else {
                let htmlContent = '';
                for (let i = 0; i < historyLogs.length; i++) {
                    let log = historyLogs[i];
                    htmlContent += `
                        <div class="history-item">
                            <span class="history-text">📅 <b>${log.date}</b> — အလုပ်: ${log.day} ရက် | OT: ${log.ot} နာရီ</span>
                            <button class="btn-edit" onclick="openEditModal(${i})" title="ပြင်ဆင်ရန်">✏️</button>
                        </div>
                    `;
                }
                historyDiv.innerHTML = htmlContent;
            }
        }
        updateDisplay();

        function logAttendance(addDay, addOt) {
            let existingLog = null;
            for (let i = 0; i < historyLogs.length; i++) {
                if (historyLogs[i].date === todayStr) {
                    existingLog = historyLogs[i];
                    break;
                }
            }

            if (existingLog) {
                if (addDay > 0) {
                    existingLog.day = (Number(existingLog.day) |

| 0) + addDay;
                }
                if (addOt > 0) {
                    existingLog.ot = (Number(existingLog.ot) |

| 0) + addOt;
                }
            } else {
                historyLogs.unshift({ date: todayStr, day: addDay, ot: addOt });
            }

            historyLogs.sort((a, b) => b.date.localeCompare(a.date));
            localStorage.setItem(storageKey, JSON.stringify(historyLogs));
            updateDisplay();
        }

        function openAddModal() {
            editingIndex = null;
            document.getElementById('modalTitleText').innerText = 'ရက်စွဲအလိုက် ထည့်သွင်းရန်';
            document.getElementById('editDateInput').value = todayStr;
            document.getElementById('editDateInput').disabled = false;
            document.getElementById('editDayInput').value = 1;
            document.getElementById('editOtInput').value = 0;
            document.getElementById('btnDeleteRow').style.display = 'none';
            document.getElementById('editModal').classList.add('active');
        }

        function openEditModal(index) {
            editingIndex = index;
            const log = historyLogs[index];
            document.getElementById('modalTitleText').innerText = 'မှတ်တမ်း ပြင်ဆင်ရန်';
            document.getElementById('editDateInput').value = log.date;
            document.getElementById('editDateInput').disabled = true;
            document.getElementById('editDayInput').value = log.day;
            document.getElementById('editOtInput').value = log.ot;
            document.getElementById('btnDeleteRow').style.display = 'block';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            editingIndex = null;
            document.getElementById('editModal').classList.remove('active');
        }

        function saveEditLog() {
            const dateVal = document.getElementById('editDateInput').value;
            if (!dateVal) {
                alert('ရက်စွဲ ရွေးချယ်ပေးပါ။');
                return;
            }

            const newDay = parseFloat(document.getElementById('editDayInput').value);
            const newOt = parseFloat(document.getElementById('editOtInput').value);
            const safeDay = isNaN(newDay) ? 0 : newDay;
            const safeOt = isNaN(newOt) ? 0 : newOt;

            if (editingIndex !== null) {
                historyLogs[editingIndex].day = safeDay;
                historyLogs[editingIndex].ot = safeOt;
                localStorage.setItem(storageKey, JSON.stringify(historyLogs));
                updateDisplay();
                closeEditModal();
                return;
            }

            const parts = dateVal.split('-');
            const targetKey = 'historyLogs_' + Number(parts[0]) + '_' + Number(parts[1]);
            let targetLogs = (targetKey === storageKey)
                ? historyLogs
                : (JSON.parse(localStorage.getItem(targetKey)) |

| []);

            let existing = null;
            for (let i = 0; i < targetLogs.length; i++) {
                if (targetLogs[i].date === dateVal) {
                    existing = targetLogs[i];
                    break;
                }
            }

            if (existing) {
                existing.day = safeDay;
                existing.ot = safeOt;
            } else {
                targetLogs.push({ date: dateVal, day: safeDay, ot: safeOt });
            }

            targetLogs.sort((a, b) => b.date.localeCompare(a.date));
            localStorage.setItem(targetKey, JSON.stringify(targetLogs));

            if (targetKey === storageKey) {
                historyLogs = targetLogs;
                updateDisplay();
            } else {
                alert(Number(parts[0]) + ' ခုနှစ်၊ ' + Number(parts[1]) + ' လပိုင်း စာရင်းထဲသို့ သိမ်းဆည်းပြီးပါပြီ။');
            }
            closeEditModal();
        }

        function deleteLogItem() {
            if (editingIndex === null) return;
            if (confirm("ဒီရက်ရဲ့ မှတ်တမ်းကို ဖျက်မှာ သေချာပါသလား?")) {
                historyLogs.splice(editingIndex, 1);
                localStorage.setItem(storageKey, JSON.stringify(historyLogs));
                updateDisplay();
                closeEditModal();
            }
        }

        function exportBackup() {
            const backupData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('historyLogs_')) {
                    backupData[k] = JSON.parse(localStorage.getItem(k));
                }
            }
            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ot-tracker-backup-' + todayStr + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported !== 'object' |

| imported === null) throw new Error('Invalid');
                    let count = 0;
                    Object.keys(imported).forEach((k) => {
                        if (k.startsWith('historyLogs_') && Array.isArray(imported[k])) {
                            localStorage.setItem(k, JSON.stringify(imported[k]));
                            count++;
                        }
                    });
                    if (count === 0) {
                        alert('OT စာရင်း Backup ဖိုင် မှန်ကန်မှု မရှိပါ။');
                        return;
                    }
                    historyLogs = JSON.parse(localStorage.getItem(storageKey)) |

| [];
                    updateDisplay();
                    alert('Backup စာရင်းများ ပြန်လည်ထည့်သွင်းပြီးပါပြီ။');
                } catch (err) {
                    alert('ဖိုင်ဖတ်ရာတွင် အမှားရှိနေပါသည်။');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetData() {
            if(confirm("ယခုလ စာရင်းအားလုံးကို ဖျက်မှာ သေချာပါသလား?")) {
                localStorage.removeItem(storageKey);
                historyLogs = [];
                updateDisplay();
            }
